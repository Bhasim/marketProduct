<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>باحث السوبرماركت</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF2F3;--card:#fff;--ink:#1B2B34;--mute:#5E7079;--tag:#FFD83D;--tagink:#241C00;--ok:#1F7A4D;--line:#D5DEE1;--btn:#1B2B34;--btnink:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#12191D;--card:#1B262C;--ink:#EAF0F2;--mute:#97A8B0;--line:#2D3C44;--btn:#FFD83D;--btnink:#241C00;--ok:#5CD08F}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;line-height:1.6;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:640px;margin:0 auto;padding:18px 14px 40px}
h1{font-size:1.5rem;margin:6px 0 2px}
.sub{color:var(--mute);margin:0 0 18px;font-size:.95rem}
label{display:block;font-weight:600;margin:14px 0 6px}
input{width:100%;font:inherit;padding:12px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
input:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--tag);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:8px}
.chip,.st{font:inherit;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer}
.st{flex:1;min-width:70px;border-radius:10px;padding:10px 6px;font-weight:600}
.st[aria-pressed=true]{background:var(--tag);color:var(--tagink);border-color:var(--tag)}
#go{width:100%;margin-top:18px;font:inherit;font-weight:700;font-size:1.05rem;padding:14px;border:0;border-radius:10px;background:var(--btn);color:var(--btnink);cursor:pointer}
#go:disabled{opacity:.5}
#status{margin:16px 0 4px;color:var(--mute);min-height:1.4em}
.err{color:#C0392B}
h2{font-size:1.1rem;margin:22px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:10px 0;display:flex;gap:12px;overflow:hidden}
.pic{width:96px;flex:none;background:#fff;display:flex;align-items:center;justify-content:center;min-height:110px}
.pic img{max-width:100%;max-height:110px;object-fit:contain}
.info{padding:10px 0;flex:1;min-width:0}
.name{font-weight:700;margin:0;overflow-wrap:anywhere}
.meta{color:var(--mute);font-size:.85rem;margin:0 0 6px}
.tag{display:inline-block;background:var(--tag);color:var(--tagink);border-radius:4px;padding:2px 10px;font-weight:700;margin-inline-end:6px}
.facts{font-size:.9rem;margin:6px 0 0}
.links{margin-top:6px;font-size:.85rem}
.links a{color:var(--ink);margin-inline-end:12px}
.best{border-color:var(--ok);border-width:2px}
.alt{background:var(--card);border-inline-start:5px solid var(--tag);padding:10px 12px;border-radius:8px;margin:10px 0}
footer{margin-top:28px;color:var(--mute);font-size:.8rem}
footer a{color:inherit}
</style>
</head>
<body>
<main>
<h1>باحث السوبرماركت</h1>
<p class="sub">أقل كربوهيدرات وسكر في Lidl وAldi وPenny وEdeka</p>

<label for="q">نوع المنتج</label>
<input id="q" type="text" placeholder="مثال: خبز، حليب، زبادي" autocomplete="off" enterkeyhint="search">
<div class="row" id="chips" style="margin-top:8px"></div>

<label>السوبرماركت</label>
<div class="row" id="stores"></div>

<button id="go">ابحث</button>
<div id="status" role="status" aria-live="polite"></div>
<div id="results"></div>
<div id="alt"></div>

<footer>البيانات من <a href="https://world.openfoodfacts.org" target="_blank" rel="noopener">Open Food Facts</a> (رخصة ODbL) ويضيفها متطوعون، فقد تكون ناقصة أو قديمة. راجع الملصق على العبوة قبل الشراء. هذا التطبيق للمعلومة فقط وليس نصيحة طبية.</footer>
</main>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const STORES={lidl:{n:'Lidl',t:['lidl']},aldi:{n:'Aldi',t:['aldi-nord','aldi-sud']},penny:{n:'Penny',t:['penny']},edeka:{n:'Edeka',t:['edeka']}};
const norm=s=>s.trim().toLowerCase().replace(/[\u064B-\u0652]/g,'').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/^ال/,'');
const DICT={};
('خبز=Brot|توست=Toastbrot|حليب=Milch|زبادي=Joghurt|لبن=Joghurt|جبن=Käse|جبنه=Käse|جبن قريش=Hüttenkäse|معكرونه=Nudeln|مكرونه=Nudeln|ارز=Reis|حبوب الافطار=Müsli|كورن فليكس=Cornflakes|شوفان=Haferflocken|عصير=Saft|شوكولاته=Schokolade|بسكويت=Kekse|شيبس=Chips|صلصه=Soße|كاتشب=Ketchup|مايونيز=Mayonnaise|بيض=Eier|زبده=Butter|زيت=Öl|مكسرات=Nüsse|لوز=Mandeln|مربي=Marmelade|عسل=Honig|ماء=Wasser|حمص=Hummus|زيتون=Oliven|تونه=Thunfisch|نقانق=Wurst|دجاج=Hähnchen|لحم=Fleisch|سمك=Fisch|كريمه=Sahne|قهوه=Kaffee|شاي=Tee|سكر=Zucker|طحين=Mehl|بطاطس=Kartoffeln|خضار=Gemüse|فواكه=Obst|فاكهه=Obst|حلويات=Süßigkeiten|ايس كريم=Eis|مشروب غازي=Limonade|كولا=Cola|عدس=Linsen|فول=Bohnen|ذره=Mais|كراكرز=Cracker|مشروب=Getränk|بسكويت مملح=Cracker|خبز التوست=Toastbrot|مياه معدنيه=Mineralwasser').split('|').forEach(p=>{const [a,b]=p.split('=');DICT[norm(a)]=b});
let store='lidl',busy=false;
const cache={};

['خبز','حليب','زبادي','جبن','معكرونة','أرز','حبوب الإفطار','عصير','شوكولاتة','بسكويت'].forEach(w=>{const b=document.createElement('button');b.className='chip';b.textContent=w;b.onclick=()=>{$('#q').value=w;go()};$('#chips').appendChild(b)});
Object.entries(STORES).forEach(([k,v])=>{const b=document.createElement('button');b.className='st';b.textContent=v.n;b.setAttribute('aria-pressed',k===store);b.onclick=()=>{store=k;document.querySelectorAll('.st').forEach(x=>x.setAttribute('aria-pressed',x===b))};$('#stores').appendChild(b)});
$('#go').onclick=go;
$('#q').addEventListener('keydown',e=>{if(e.key==='Enter')go()});

async function toDE(t){
  if(!/[\u0600-\u06FF]/.test(t))return t;
  const k=norm(t);if(DICT[k])return DICT[k];
  try{const r=await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(t)+'&langpair=ar|de');const j=await r.json();return (j.responseData&&j.responseData.translatedText)||t}catch(e){return t}
}
async function fetchTag(term,tag){
  const key=term+'|'+tag;if(cache[key])return cache[key];
  const u='https://world.openfoodfacts.org/cgi/search.pl?action=process&json=1&search_simple=1&page_size=100&search_terms='+encodeURIComponent(term)
   +'&tagtype_0=countries&tag_contains_0=contains&tag_0=germany&tagtype_1=stores&tag_contains_1=contains&tag_1='+tag
   +'&fields=code,product_name,product_name_de,brands,quantity,nutriments,nutriscore_grade,image_front_small_url,image_front_url,image_nutrition_url,image_ingredients_url';
  const r=await fetch(u);if(!r.ok)throw new Error(r.status);
  const j=await r.json();return cache[key]=j.products||[];
}
function clean(p){
  const n=p.nutriments||{};const c=n.carbohydrates_100g;
  if(c==null||c===''||isNaN(+c))return null;
  const s=n.sugars_100g;
  return {code:p.code,name:p.product_name_de||p.product_name||'بدون اسم',brand:p.brands||'',qty:p.quantity||'',c:+c,s:(s==null||s==='')?null:+s,k:n['energy-kcal_100g'],ns:p.nutriscore_grade,img:p.image_front_small_url||p.image_front_url,nut:p.image_nutrition_url,ing:p.image_ingredients_url};
}
async function best(term,sk){
  const lists=await Promise.all(STORES[sk].t.map(t=>fetchTag(term,t)));
  const m=new Map();lists.flat().forEach(p=>{const c=clean(p);if(c)m.set(c.code,c)});
  return [...m.values()].sort((a,b)=>a.c-b.c||(a.s??999)-(b.s??999));
}
async function price(code){
  try{const r=await fetch('https://prices.openfoodfacts.org/api/v1/prices?product_code='+code+'&order_by=-date&size=1');const j=await r.json();const it=j.items&&j.items[0];return it?`${it.price} ${it.currency} (${it.date})`:null}catch(e){return null}
}
const f=(v,u)=>v==null?'—':(Math.round(v*10)/10)+u;
function card(p,top){
  return `<div class="card${top?' best':''}"><div class="pic">${p.img?`<img src="${esc(p.img)}" alt="" loading="lazy" onerror="this.remove()">`:'🛒'}</div>
  <div class="info"><p class="name">${esc(p.name)}</p><p class="meta">${esc(p.brand)}${p.qty?' • '+esc(p.qty):''}</p>
  <span class="tag">كربوهيدرات ${f(p.c,' غ')}</span><span class="tag">سكر ${f(p.s,' غ')}</span>
  <p class="facts">لكل 100 غ • سعرات ${f(p.k,'')} ${p.ns?'• Nutri-Score '+esc(p.ns.toUpperCase()):''}<br>آخر سعر مسجّل: <span data-p="${esc(p.code)}">…</span></p>
  <p class="links">${p.nut?`<a href="${esc(p.nut)}" target="_blank" rel="noopener">جدول التغذية</a>`:''}${p.ing?`<a href="${esc(p.ing)}" target="_blank" rel="noopener">المكونات</a>`:''}<a href="https://world.openfoodfacts.org/product/${esc(p.code)}" target="_blank" rel="noopener">الصفحة</a></p></div></div>`;
}
async function fillPrices(root,list){
  for(const p of list){const v=await price(p.code);root.querySelectorAll(`[data-p="${CSS.escape(p.code)}"]`).forEach(e=>e.textContent=v||'غير متوفر')}
}
async function go(){
  const raw=$('#q').value.trim();if(!raw||busy)return;
  busy=true;$('#go').disabled=true;$('#results').innerHTML='';$('#alt').innerHTML='';
  const st=$('#status');st.className='';
  try{
    st.textContent='جارٍ الترجمة...';
    const term=await toDE(raw);
    st.textContent=`البحث عن "${term}" في ${STORES[store].n}...`;
    const mine=await best(term,store);
    const top=mine.slice(0,5);
    if(!top.length){st.textContent=`لم أجد منتجات ببيانات تغذية في ${STORES[store].n}. جرّب الكلمة بالألمانية أو اختر متجرًا آخر.`}
    else{
      st.textContent=`الأقل كربوهيدرات في ${STORES[store].n} (بحث: ${term}) • ${mine.length} منتج بيانات كاملة`;
      $('#results').innerHTML='<h2>'+STORES[store].n+'</h2>'+top.map((p,i)=>card(p,i===0)).join('');
      fillPrices($('#results'),top);
    }
    // compare with other stores
    const alts=[];
    for(const k of Object.keys(STORES)){
      if(k===store)continue;
      try{const l=await best(term,k);if(l[0])alts.push({k,p:l[0]})}catch(e){}
    }
    const mt=top[0];
    const better=alts.filter(a=>!mt||a.p.c<mt.c||(a.p.c===mt.c&&(a.p.s??999)<(mt.s??999))).sort((a,b)=>a.p.c-b.p.c);
    if(better.length){
      const a=better[0];
      $('#alt').innerHTML=`<h2>خيار أقل في متجر آخر</h2><div class="alt">في <b>${STORES[a.k].n}</b> يوجد منتج بكربوهيدرات أقل:</div>`+card(a.p,false);
      fillPrices($('#alt'),[a.p]);
    }else if(mt&&alts.length){
      $('#alt').innerHTML='<div class="alt">لم أجد في المتاجر الأخرى منتجًا أقل منه في هذا البحث.</div>';
    }
  }catch(e){
    st.className='err';
    st.textContent='تعذّر الاتصال بـ Open Food Facts. قد تكون الخدمة مشغولة أو تجاوزتَ حد الطلبات، فانتظر دقيقة وأعد المحاولة.';
  }
  busy=false;$('#go').disabled=false;
}
</script>
</body>
</html>
