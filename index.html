<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>أفضل منتج في السوبرماركت</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef3f1; --card:#ffffff; --ink:#12332e; --muted:#5b726d; --line:#d3e0dc;
  --accent:#0f6b5c; --accent-ink:#ffffff; --warn:#b45309; --good:#0f7a4d; --chip:#e1ece8;
  --bar:#cfe3dd; --bar-fill:#0f6b5c;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1a18; --card:#162724; --ink:#e4f1ed; --muted:#93aaa4; --line:#264039;
    --accent:#4fd1b3; --accent-ink:#06211b; --warn:#f2b35c; --good:#5fd79b; --chip:#1f3731;
    --bar:#24413a; --bar-fill:#4fd1b3;
  }
}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"IBM Plex Sans Arabic","Segoe UI",Tahoma,Arial,sans-serif;line-height:1.6;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:760px;margin:0 auto;padding:16px 14px 48px}
h1{font-size:1.5rem;margin:8px 0 2px;font-weight:700}
.sub{margin:0 0 16px;color:var(--muted);font-size:.95rem}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
label.t{display:block;font-weight:500;margin:0 0 6px;font-size:.92rem}
.stores{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.stores button{padding:11px 4px;border:1.5px solid var(--line);background:transparent;color:var(--ink);
  border-radius:10px;font:inherit;font-weight:700;cursor:pointer}
.stores button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
select,input[type=text]{width:100%;padding:11px 10px;border:1.5px solid var(--line);border-radius:10px;
  background:var(--bg);color:var(--ink);font:inherit}
.row{display:grid;grid-template-columns:1fr;gap:12px;margin-bottom:14px}
.row.two{grid-template-columns:1fr 1fr}
.go{width:100%;padding:13px;border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink);
  font:inherit;font-weight:700;font-size:1.05rem;cursor:pointer}
.go:disabled{opacity:.6}
:focus-visible{outline:3px solid var(--warn);outline-offset:2px}
#status{margin:16px 2px;color:var(--muted)}
.err{color:var(--warn)}
h2{font-size:1.1rem;margin:22px 2px 10px}
.prod{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:14px}
.prod.best{border:2px solid var(--accent)}
.rank{padding:6px 12px;font-size:.85rem;color:var(--muted);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px}
.prod.best .rank{background:var(--accent);color:var(--accent-ink);font-weight:700}
.gallery{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:0;background:#fff;direction:ltr}
.gallery figure{flex:0 0 100%;margin:0;scroll-snap-align:center;position:relative;height:210px;display:flex;align-items:center;justify-content:center}
.gallery img{max-width:100%;max-height:100%;object-fit:contain}
.gallery figcaption{position:absolute;bottom:6px;inset-inline-start:8px;background:rgba(0,0,0,.6);color:#fff;font-size:.75rem;padding:1px 8px;border-radius:99px;direction:rtl}
.noimg{color:#789;font-size:.9rem}
.body{padding:12px 14px 14px}
.name{font-weight:700;font-size:1.05rem;margin:0}
.meta{color:var(--muted);font-size:.88rem;margin:2px 0 10px}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.n{background:var(--chip);border-radius:10px;padding:8px 6px;text-align:center}
.n b{display:block;font-size:1.25rem;line-height:1.2}
.n span{font-size:.78rem;color:var(--muted)}
.bar{height:8px;background:var(--bar);border-radius:99px;overflow:hidden;margin:2px 0 4px}
.bar i{display:block;height:100%;background:var(--bar-fill)}
.barlbl{font-size:.78rem;color:var(--muted);margin-bottom:10px}
.price{display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:1px dashed var(--line);padding-top:10px;font-size:.92rem}
.price strong{font-size:1.15rem}
.price small{color:var(--muted)}
a{color:var(--accent)}
.sug{border-inline-start:4px solid var(--good)}
.sugtag{display:inline-block;background:var(--good);color:#fff;font-size:.78rem;padding:1px 9px;border-radius:99px;margin-bottom:6px}
.more{width:100%;padding:11px;border:1.5px solid var(--accent);background:transparent;color:var(--accent);border-radius:10px;font:inherit;font-weight:700;cursor:pointer;margin-bottom:10px}
.note{font-size:.8rem;color:var(--muted);margin-top:22px}
</style>
</head>
<body>
<div class="wrap">
  <h1>أفضل منتج في السوبرماركت</h1>
